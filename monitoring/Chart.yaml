apiVersion: v2
name: monitoring-stack
description: Umbrella chart that installs Grafana, Prometheus, Alertmanager, node-exporter and kube-state-metrics
type: application
version: 0.1.0
appVersion: "0.1.0"

dependencies:
  - name: grafana
    version: "9.2.10"                      
    repository: "https://grafana.github.io/helm-charts"
  - name: prometheus
    version: "27.30.0"                      
    repository: "https://prometheus-community.github.io/helm-charts"
  - name: prometheus-node-exporter
    version: "4.47.1"
    repository: "https://prometheus-community.github.io/helm-charts"
  - name: kube-state-metrics
    version: "5.33.0"
    repository: "https://prometheus-community.github.io/helm-charts"
